[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "satinlore"
version = "0.1.0"
description = "Browser-first story synchronisation development scaffold"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.162,<0.163", "uvicorn>=0.54,<0.55"]

[project.optional-dependencies]
dev = ["httpx>=0.28,<0.29", "pytest>=9.2,<9.3"]

[tool.setuptools.packages.find]
include = ["app", "app.*"]

[tool.setuptools.package-data]
app = ["static/*.html", "static/*.css", "static/*.mjs", "static/**/*.mjs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
